services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./specs:/usr/src/app/specs
    depends_on:
      - reservations
      - auth
      - payments
      - notifications
      - mongo
    command: >
      sh -c "sleep 5 && pnpm test"
  reservations:
    image: us-east4-docker.pkg.dev/reservations-472613/reservations/production
    env_file:
      - ../apps/reservations/.env
    ports:
      - '3000:3000'
  auth:
    image: us-east4-docker.pkg.dev/reservations-472613/auth/production
    env_file:
      - ../apps/auth/.env
    ports:
      - '3001:3001'
  payments:
    image: us-east4-docker.pkg.dev/reservations-472613/payments/production
    ports:
      - '3003:3003'
    env_file:
      - ../apps/payments/.env
  notifications:
    image: us-east4-docker.pkg.dev/reservations-472613/notifications/production
    ports:
      - '3004:3004'
    env_file:
      - ../apps/notifications/.env
  mongo:
    image: mongo